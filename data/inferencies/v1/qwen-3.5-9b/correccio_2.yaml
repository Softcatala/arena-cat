    les muralles i el circ romà. El seu conjunt arqueològic ha estat declarat Patrimoni
    Mundial per la UNESCO. A més de la seva història, Tarragona destaca per les seves
    platges, el seu port i la gastronomia basada en productes del mar. Les festes
    de Santa Tecla i els castells són dues de les tradicions més representatives de
    la ciutat.
