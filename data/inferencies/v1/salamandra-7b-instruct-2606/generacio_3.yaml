    \ amb la vida quotidiana, com als vitralls de la Casa Amatller, que il·luminaven\
    \ les llars amb colors vius.  \n\nAquest moviment va canviar l'estètica catalana,\
    \ destacant per la seva originalitat i bellesa.  \n\n(120 paraules)"
