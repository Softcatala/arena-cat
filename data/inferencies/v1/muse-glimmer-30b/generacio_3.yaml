    a Barcelona sembla una escama de peix.

    Un altre tret és la decoració molt rica i detallada. Tots els elements, des de
    la porta fins als mobles, formen part d’un mateix disseny. Per exemple, el Parc
    Güell té bancs de ceràmica de colors i formes de plantes.'
