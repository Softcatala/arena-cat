output:
  answer: 'Hola, Josep! Quina alegria veure''t aquí. Finalment el mercat reobre dissabte
    després de sis setmanes d''obres. M''encanta que hagin renovat la teulada, els
    punts de llum i sobretot les cambres frigorífiques. El meu peix s''hi estarà molt
    més fresc.


    Doncs sí, però jo tinc una mala notícia. La meva fleca no tornarà al seu lloc
    habitual fins al novembre. Hauré de fer malabarismes amb un espai provisional.
    De tota manera, veig que les parades de peix i fruita tornem al passadís central,
    que és on sempre hem estat.


    Quina sort la teva! Jo només puc esperar. Per cert, saps que a les deu del matí
    hi haurà una visita guiada per als veïns? També hi haurà una demostració de cuina
    amb productes de temporada.


    Mira, això sí que m''agrada. Anirem junts? M''encantaria veure els canvis abans
    de tornar a la meva parada provisional.


    Comptem-hi! Serà un bon començament per a tots dos, encara que jo hagi d''esperar
    una mica més per al meu racó.'
