output:
  answer: Quan el cel es posa trist, les seues núvols s'omplen d'aigua. Són com butxaques
    massa plenes. Primer aguanten una estona. Després, una mica més. Fins que ja no
    poden més. Tantes pessigolles els fan reir. Aleshores obren la mà. Deixen caure
    gotetes sobre els teulats. També sobre els estanyols. I sobre les fulles del parc.
    Això és la pluja. Algunes gotes corren per les finestres. Altres es queden quietes.
    Miren el món al revés. Quan la núvol es calma, el sol torna a eixir. Assoleix
    cada racó. Amb un mantell de llum.
