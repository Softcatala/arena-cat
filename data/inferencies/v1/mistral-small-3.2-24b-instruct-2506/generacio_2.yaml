  answer: 'Bon dia a tots! Avui us vull parlar dels castells, una tradició catalana
    fascinant. Els castells són torres humanes que es construeixen en equips, combinant
    força, equilibri, valor i seny. Aquestes quatre paraules defineixen l''esperit
    dels castells: treball en equip, precisió, coratge i saviesa.


