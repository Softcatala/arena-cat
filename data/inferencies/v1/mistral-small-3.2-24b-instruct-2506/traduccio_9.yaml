output:
  answer: 'Quan arriba la nit, la nena doblega la roba damunt la cadira, es posa el
    seu pijama preferit i s''amaga al llit amb l''os de peluix que ja té una orella
    torçada. La seva mare deixa la porta entornada perquè entri una ratllet de llum
