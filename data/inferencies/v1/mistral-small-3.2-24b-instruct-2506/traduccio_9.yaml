output:
  answer: 'Quan arriba la nit, la nena dobla la roba damunt de la cadira, se li posa
    el pijama preferit i s''hi enfila al llit amb l''osset de peluix que ja té una
    orella torçada. La seva mare deixa la porta entreoberta perquè hi entri una ratllada
