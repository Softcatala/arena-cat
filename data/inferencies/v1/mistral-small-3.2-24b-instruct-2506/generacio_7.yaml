output:
  answer: 'Sant Jordi és una celebració que uneix cultura i tradició, i avui en dia
    és més important que mai adaptar-la a nous formats per arribar a totes les generacions.
    Els audiollibres i els còmics digitals són eines modernes que poden revitalitzar
    la nostra tradició, sense perdre l''essència de la festa.


    En primer lloc, aquests formats fan la literatura més accessible. Els audiollibres
    permeten gaudir de les obres literàries mentre es realitzen altres activitats,
    i els còmics digitals atreuen a un públic més jove amb il·lustracions i interactivitat.
    Així, es pot arribar a persones que, d''altra banda, podrien no sentir-se atretes
    per la lectura tradicional.


    En segon lloc, integrar noves tecnologies en Sant Jordi pot fomentar la creativitat
    i l''innovació. Els instituts poden organitzar tallers per crear còmics digitals
    o gravar audiollibres, combinant l''aprenentatge de les lletres amb l''ús de les
    noves tecnologies.


    Per a l''institut, proposo organitzar una setmana cultural amb dues activitats
    principals: una exposició de còmics digitals creats per alumnes i una sessió d''audiollibres
    narrats per professors i estudiants. D''aquesta manera, celebrarem Sant Jordi
    de forma innovadora i inclusiva, mantenint viu l''esperit de la nostra tradició.'
