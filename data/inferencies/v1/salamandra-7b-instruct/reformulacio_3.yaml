output:
  answer: 'A l’atenció de l’Ajuntament de XYZ,

    Com a veïns del barri de Sant Andreu volem fer saber les molèsties causades pels
    problemes de manteniment de les instal·lacions municipals que ens afecten directament.
    En concret, hem sofert dues avaries durant aquestes últimes setmanes, una referent
    a l’enllumenat públic i l’altra relacionada amb el clavegueram municipal. El primer
    cas afecta als carrers dels voltants de Cal Fuster; concretament, el número vint-i-dos
    de la Travessia de Cal Fuster ha quedat completament a fosques des de fa ja tres
    setmanes. Això és molt perillós perquè dificulta notablement la circulació viària
    tant pel veïnatge com pels vianants que circulen pel carrer. A més, aquesta situació
    comporta altres efectes negatius indirectes deguts a la manca d''il·luminació
    adequada (com ara increment de robatoris o agressions). Per acabar-ho d’adobar,
    encara estem esperant resposta de part vostre després de trucar repetidament a
    diferents números telefònics per tal de poder posar remei al problema. Pel que
    fa al segon assumpte, avui mateix han caigut diverses rajoles del segon pis de
    casa meva per culpa d''un sot de mida considerable situat dins la mateixa vorera
    davant de la porta principal del meu habitatge. Aquest fet posa en risc la integritat
    física de qualsevol persona que transiti per allà sense ser conscient de la seva
    presència degut a la poca visibilitat generada per la falta d''il·luminació correcta
    abans descrita. No obstant això, tampoc no hi ha hagut cap mena d''actuació immediata
    per part vostra malgrat haver demanat ajuda urgent via telèfon mòbil amb fotografies
    adjuntant informació personal identificativa. Esperem una ràpida intervenció en
    relació amb aquests temes pendents amb urgència.

    Atentament,

    Els Veïns de Sant Andreu.'
