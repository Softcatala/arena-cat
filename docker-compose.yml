# Entorn local d'Arena Cat.
# Aixeca PostgreSQL 16, aplica les migracions, arrenca l'API i serveix el client HTML.
# PostgreSQL provisiona el rol d'aplicació i la base de dades de tests mitjançant infra/init-db.sh.
#
# Les variables provenen del fitxer .env (vegeu .env.example).

services:
  postgres:
    image: postgres:16
    container_name: arena-cat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Disponibles per a l'script d'inicialització (no les fa servir Postgres directament).
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arena-cat-pgdata:/var/lib/postgresql/data
      # L'script només s'executa en la primera inicialització (volum buit).
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      # Forcem TCP (-h 127.0.0.1): durant la inicialització el servidor temporal
      # només escolta pel socket, així no es marca sa abans d'acabar init-db.sh.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Sobreescrivim DB_HOST perquè el contenidor busqui la base de dades a la xarxa interna
      # Així podem mantenir DB_HOST=127.0.0.1 al .env per executar tests
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: python:3.12-slim
    working_dir: /srv/html
    command: python3 -m http.server 5500 --bind 0.0.0.0
    ports:
      - "127.0.0.1:${HTML_PORT:-5500}:5500"
    volumes:
      - ./html:/srv/html:ro
    depends_on:
      - api

volumes:
  arena-cat-pgdata:
