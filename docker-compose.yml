# Entorn local d'Arena Cat.
# Aixeca PostgreSQL 16, l'API i la interfície amb recàrrega automàtica.
# PostgreSQL provisiona el rol d'aplicació i la base de dades de tests mitjançant infra/init-db.sh.
#
# Les variables provenen del fitxer .env (vegeu .env.example).

services:
  postgres:
    image: postgres:16
    container_name: arena-cat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Disponibles per a l'script d'inicialització (no les fa servir Postgres directament).
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arena-cat-pgdata:/var/lib/postgresql/data
      # L'script només s'executa en la primera inicialització (volum buit).
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      # Forcem TCP (-h 127.0.0.1): durant la inicialització el servidor temporal
      # només escolta pel socket, així no es marca sa abans d'acabar init-db.sh.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/backend/app:ro
      - ./backend/migrations:/app/backend/migrations:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Sobreescrivim DB_HOST perquè el contenidor busqui la base de dades a la xarxa interna
      # Així podem mantenir DB_HOST=127.0.0.1 al .env per executar tests
      - DB_HOST=postgres
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && exec npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - arena-cat-node-modules:/app/node_modules
    depends_on:
      - api

  # Contenidors de monitoratge: no s'aixequen amb `docker compose up`.
  # Només calen per provar les mètriques: `docker compose --profile monitoring up`.
  prometheus:
    image: prom/prometheus:v3.11.2
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./telemetry_config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=31d"
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./telemetry_config/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # /metrics endpoint

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - ./telemetry_config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./telemetry_config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./telemetry_config/grafana/dashboards-json:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  arena-cat-pgdata:
  arena-cat-node-modules:
